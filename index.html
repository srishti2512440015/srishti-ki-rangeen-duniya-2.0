<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>The Gilded Lung</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:
            linear-gradient(
            rgba(10,8,5,0.92),
            rgba(15,10,5,0.96)),
            url("images/bg.jpg");

            background-size:cover;
            background-position:center;
            background-attachment:fixed;

            min-height:100vh;

            overflow:hidden;

            font-family:Georgia, serif;

            color:#f1d7a3;
        }

        .container{

            width:100%;

            padding-top:20px;
        }

        /* TITLE */

        .title-container{

            width:100%;

            display:flex;
            justify-content:center;
            align-items:center;

            margin-bottom:20px;
        }

        .title-image{

            width:950px;

            max-width:95%;
        }

        /* SUBTITLE */

        .subtitle-box{

            width:420px;
            height:75px;

            margin:0 auto 90px auto;

            transform:rotate(-7deg);

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:24px;
            font-style:italic;

            color:#f2cb73;

            background:
            linear-gradient(
            to bottom,
            rgba(60,42,28,0.95),
            rgba(25,18,12,0.95));
        }

        /* NAVIGATION */

        .nav-section{

            display:flex;
            justify-content:center;

            gap:50px;

            margin-top:80px;

            flex-wrap:wrap;
        }

        .nav-btn{

            width:260px;
            height:80px;

            text-decoration:none;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:28px;

            letter-spacing:3px;

            color:#e7d1aa;

            transition:0.3s;

            background:
            linear-gradient(
            to bottom,
            rgba(50,35,24,0.95),
            rgba(20,14,10,0.95));
        }

        .nav-btn:hover{

            transform:scale(1.08);

            background:#3d7d8f;

            color:white;
        }

        /* STEAM */

        .steam{

            position:fixed;

            width:450px;
            height:450px;

            background:
            radial-gradient(
            rgba(255,255,255,0.04),
            transparent 70%);

            filter:blur(45px);

            animation:steamFloat 12s infinite ease-in-out;
        }

        .steam:nth-child(1){

            top:0;
            left:0;
        }

        .steam:nth-child(2){

            bottom:0;
            right:0;

            animation-delay:4s;
        }

        @keyframes steamFloat{

            0%{
                transform:translateY(0px);
            }

            50%{
                transform:translateY(-30px);
            }

            100%{
                transform:translateY(0px);
            }
        }

    </style>

</head>

<body>

    <div class="steam"></div>
    <div class="steam"></div>

    <div class="container">

        <div class="title-container">

            <img src="images/title.png"
            class="title-image">

        </div>

        <div class="subtitle-box">

            A World Choking On Its Own Machines

        </div>

        <div class="nav-section">

            <a href="characters.html"
            class="nav-btn">

                CHARACTERS

            </a>

            <a href="story.html"
            class="nav-btn">

                STORY

            </a>

            <a href="listen.html"
            class="nav-btn">

                LISTEN

            </a>

        </div>

    </div>

</body>
</html>
